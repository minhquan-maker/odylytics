    <script>
      try {
        var theme = localStorage.getItem('odylytics-theme')
        if (theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141413')
        }
        var motion = localStorage.getItem('odylytics-motion')
        document.documentElement.dataset.motion = motion === 'reduce' || (motion !== 'full' && matchMedia('(prefers-reduced-motion: reduce)').matches) ? 'reduce' : 'full'
      } catch (e) {}
    </script>
    <title>Odylytics - Engineering Changes</title>
